# Blueprint：从 monorepo 根部署「每日一诗」静态站到 Render
# Dashboard: https://dashboard.render.com → New → Blueprint → 选本仓库
# 静态构建环境通常无 Python：请先本地运行 build 脚本再提交 site/poems.json

services:
  - type: web
    name: daily-poem
    runtime: static
    rootDir: poem-20260313
    buildCommand: "true"
    staticPublishPath: site
    headers:
      - path: /*
        name: Cache-Control
        value: public, max-age=300
      - path: /poems.json
        name: Cache-Control
        value: public, max-age=120
