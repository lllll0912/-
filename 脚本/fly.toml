# yaml-language-server: $schema=https://raw.githubusercontent.com/fly-apps/flyctl/master/api/schemas/fly.v1.json
app = "bill-private-lllll0912"
primary_region = "nrt"

[build]
  dockerfile = "脚本/Dockerfile"

[env]
  BILL_DATA_DIR = "/data"
  PORT = "8501"
  BILL_COOKIE_SECURE = "1"

[http_service]
  internal_port = 8501
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1

[mounts]
  source = "bill_data"
  destination = "/data"
