<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>喝水小窗</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}?v=r22" />
  <style>
    html, body.water-widget-page {
      margin: 0;
      min-height: 100%;
      background: linear-gradient(165deg, #0c4a6e 0%, #0e7490 40%, #064e3b 100%);
      color: #e0f2fe;
      font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    }
    .ww {
      box-sizing: border-box;
      padding: 16px 16px 18px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .ww-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
    }
    .ww-top h1 {
      margin: 0;
      font-size: 16px;
      font-weight: 650;
      letter-spacing: 0.02em;
    }
    .ww-pin {
      font-size: 11px;
      opacity: 0.75;
    }
    .ww-motivate {
      margin: 0;
      font-size: 13px;
      line-height: 1.45;
      color: #a5f3fc;
      min-height: 2.6em;
    }
    .ww-times {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }
    .ww-time {
      padding: 10px 12px;
      border-radius: 14px;
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(125, 211, 252, 0.22);
    }
    .ww-time.is-next {
      background: rgba(45, 212, 191, 0.18);
      border-color: rgba(94, 234, 212, 0.4);
    }
    .ww-time-label {
      font-size: 11px;
      opacity: 0.8;
      margin-bottom: 4px;
    }
    .ww-time-value {
      font-variant-numeric: tabular-nums;
      font-size: 22px;
      font-weight: 750;
      letter-spacing: 0.02em;
    }
    .ww-time-sub {
      margin-top: 4px;
      font-size: 11px;
      opacity: 0.85;
      min-height: 1.2em;
    }
    .ww-time-sub.is-due {
      color: #fde68a;
      font-weight: 650;
      opacity: 1;
    }
    .ww-progress {
      height: 10px;
      border-radius: 999px;
      background: rgba(255,255,255,0.12);
      overflow: hidden;
    }
    .ww-progress > i {
      display: block;
      height: 100%;
      background: linear-gradient(90deg, #38bdf8, #2dd4bf);
      border-radius: 999px;
      width: 0%;
      transition: width 0.35s ease;
    }
    .ww-stats {
      font-size: 22px;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
    }
    .ww-stats span { font-size: 13px; font-weight: 500; opacity: 0.8; }
    .ww-btn {
      margin-top: auto;
      border: 0;
      border-radius: 14px;
      padding: 16px 12px;
      font-size: 17px;
      font-weight: 700;
      cursor: pointer;
      color: #082f49;
      background: linear-gradient(180deg, #7dd3fc, #2dd4bf);
      box-shadow: 0 8px 24px rgba(45, 212, 191, 0.28);
    }
    .ww-btn:disabled { opacity: 0.6; cursor: wait; }
    .ww-btn:active { transform: translateY(1px); }
    .ww-foot {
      display: flex;
      justify-content: space-between;
      font-size: 11px;
      opacity: 0.65;
    }
    .ww-foot a { color: #bae6fd; }
    .ww-toast {
      position: fixed;
      left: 12px; right: 12px; top: 12px;
      padding: 10px 12px;
      border-radius: 10px;
      background: rgba(15, 23, 42, 0.92);
      border: 1px solid rgba(125, 211, 252, 0.35);
      font-size: 13px;
      display: none;
      z-index: 20;
    }
    .ww-toast.show { display: block; }
  </style>
</head>
<body class="water-widget-page">
  <div id="ww-toast" class="ww-toast"></div>
  <div class="ww">
    <div class="ww-top">
      <h1>喝水提醒</h1>
      <span class="ww-pin">网页小窗</span>
    </div>
    <p class="ww-motivate" id="ww-motivate">{{ motivate }}</p>
    <div class="ww-times">
      <div class="ww-time">
        <div class="ww-time-label">现在</div>
        <div class="ww-time-value" id="ww-now">--:--:--</div>
        <div class="ww-time-sub">上海时间</div>
      </div>
      <div class="ww-time{% if reminder_enabled and next_slot %} is-next{% endif %}" id="ww-next-card">
        <div class="ww-time-label">下次提醒</div>
        <div class="ww-time-value" id="ww-next-hm">{{ next_slot_hm or '—' }}</div>
        <div class="ww-time-sub" id="ww-countdown">—</div>
      </div>
    </div>
    <div class="ww-stats"><strong id="ww-total">{{ today_total }}</strong> <span>/ <span id="ww-goal">{{ goal }}</span> ml</span></div>
    <div class="ww-progress"><i id="ww-bar" style="width: {{ pct }}%;"></i></div>
    <button type="button" class="ww-btn" id="ww-drink">喝了一杯（{{ cup_ml }} ml）</button>
    <div class="ww-foot">
      <a href="{{ url_for('water.water_home') }}" target="_blank" rel="noopener">打开完整页</a>
      <span id="ww-cup-hint">默认 {{ cup_ml }} ml</span>
    </div>
  </div>
  <script>
  (function () {
    var statusUrl = {{ url_for('water.water_api_status')|tojson }};
    var drinkUrl = {{ url_for('water.water_api_drink')|tojson }};
    var cupMl = {{ cup_ml|int }};
    var nextIso = {{ (next_slot or '')|tojson }};
    var reminderOn = {{ 'true' if reminder_enabled else 'false' }};
    var notifiedKey = "";
    var toastEl = document.getElementById("ww-toast");

    function pad(n) { return String(n).padStart(2, "0"); }
    function toast(msg) {
      toastEl.textContent = msg;
      toastEl.classList.add("show");
      setTimeout(function () { toastEl.classList.remove("show"); }, 2200);
    }

    function tickClock() {
      var d = new Date();
      document.getElementById("ww-now").textContent =
        pad(d.getHours()) + ":" + pad(d.getMinutes()) + ":" + pad(d.getSeconds());
    }

    function applyStatus(d) {
      document.getElementById("ww-total").textContent = d.today_total;
      document.getElementById("ww-goal").textContent = d.goal;
      document.getElementById("ww-bar").style.width = (d.pct || 0) + "%";
      document.getElementById("ww-motivate").textContent = d.motivate || "";
      cupMl = d.cup_ml;
      document.getElementById("ww-drink").textContent = "喝了一杯（" + cupMl + " ml）";
      document.getElementById("ww-cup-hint").textContent = "默认 " + cupMl + " ml";
      reminderOn = !!d.reminder_enabled;
      nextIso = d.next_slot || "";
      if (d.next_slot_hm) {
        document.getElementById("ww-next-hm").textContent = d.next_slot_hm;
      }
      var card = document.getElementById("ww-next-card");
      if (card) {
        card.className = "ww-time" + (reminderOn && nextIso ? " is-next" : "");
      }
      tickCountdown();
    }

    function tickCountdown() {
      var el = document.getElementById("ww-countdown");
      var hmEl = document.getElementById("ww-next-hm");
      if (!reminderOn) {
        el.className = "ww-time-sub";
        el.textContent = "提醒已关闭";
        hmEl.textContent = "—";
        document.title = "喝水小窗";
        return;
      }
      if (!nextIso) {
        el.textContent = "暂无提醒点";
        hmEl.textContent = "—";
        return;
      }
      var nextAt = new Date(nextIso);
      if (!isNaN(nextAt.getTime())) {
        hmEl.textContent = pad(nextAt.getHours()) + ":" + pad(nextAt.getMinutes());
      }
      var ms = nextAt - new Date();
      if (ms <= 0) {
        el.className = "ww-time-sub is-due";
        el.textContent = "该喝水啦！";
        document.title = "该喝水啦！";
        if (notifiedKey !== nextIso) {
          notifiedKey = nextIso;
          try {
            if (window.Notification && Notification.permission === "granted") {
              new Notification("喝水提醒", { body: "到点了，记一杯吧。" });
            } else if (window.Notification && Notification.permission === "default") {
              Notification.requestPermission();
            }
          } catch (e) {}
        }
        return;
      }
      el.className = "ww-time-sub";
      var sec = Math.floor(ms / 1000);
      var h = Math.floor(sec / 3600);
      var m = Math.floor((sec % 3600) / 60);
      var s = sec % 60;
      var label = (h > 0 ? h + ":" : "") + pad(m) + ":" + pad(s);
      el.textContent = "还有 " + label;
      document.title = label + " · 喝水";
    }

    function refresh() {
      fetch(statusUrl, { credentials: "same-origin" })
        .then(function (r) { return r.json(); })
        .then(applyStatus)
        .catch(function () {});
    }

    document.getElementById("ww-drink").addEventListener("click", function () {
      var btn = this;
      btn.disabled = true;
      var body = new URLSearchParams();
      body.set("amount_ml", String(cupMl));
      fetch(drinkUrl, {
        method: "POST",
        credentials: "same-origin",
        headers: { "Content-Type": "application/x-www-form-urlencoded" },
        body: body.toString()
      })
        .then(function (r) { return r.json(); })
        .then(function (d) {
          if (!d.ok) throw new Error(d.error || "失败");
          applyStatus(d);
          toast("已记录 " + d.amount_ml + " ml · 清爽一点");
        })
        .catch(function (e) { toast(e.message || "打卡失败"); })
        .finally(function () { btn.disabled = false; });
    });

    tickClock();
    tickCountdown();
    setInterval(tickClock, 1000);
    setInterval(tickCountdown, 1000);
    setInterval(refresh, 20000);
    if (window.Notification && Notification.permission === "default") {
      try { Notification.requestPermission(); } catch (e) {}
    }
  })();
  </script>
</body>
</html>
