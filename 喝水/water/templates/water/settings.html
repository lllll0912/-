{% extends "layout.html" %}
{% block title %}喝水设置{% endblock %}
{% block content %}
<div class="card">
  <div class="row" style="justify-content: space-between; align-items: center;">
    <div>
      <h2>喝水设置</h2>
      <p class="muted">网站版支持页内倒计时与浏览器通知（需授权且页面打开）。系统置顶弹窗仅 legacy 桌面版提供。</p>
    </div>
    <a class="btn-secondary pill-link" href="{{ url_for('water.water_home') }}">返回今日</a>
  </div>
</div>

<form method="post" class="card">
  <div class="row" style="gap: 16px; flex-wrap: wrap;">
    <div>
      <label class="field-label">每日首次提醒</label>
      <input type="time" name="schedule_start" value="{{ settings.schedule_start }}" required />
    </div>
    <div>
      <label class="field-label">间隔（小时）</label>
      <input type="number" name="schedule_interval_hours" step="0.5" min="0.5" max="12" value="{{ settings.schedule_interval_hours }}" required />
    </div>
    <div>
      <label class="field-label">默认杯量 ml</label>
      <input type="number" name="cup_ml" min="1" max="5000" value="{{ settings.cup_ml }}" required />
    </div>
    <div>
      <label class="field-label">每日目标 ml</label>
      <input type="number" name="daily_goal_ml" min="1" max="20000" value="{{ settings.daily_goal_ml }}" required />
    </div>
  </div>
  <label class="chip" style="margin-top: 16px; display: inline-flex;">
    <input type="checkbox" name="reminder_enabled" value="1" {% if settings.reminder_enabled %}checked{% endif %} />
    启用页内提醒
  </label>
  <div class="row" style="margin-top: 16px;">
    <button type="submit">保存设置</button>
  </div>
</form>
{% endblock %}
