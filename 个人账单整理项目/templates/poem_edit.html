{% extends "layout.html" %}
{% block title %}{% if poem_id %}编辑诗词{% else %}新增诗词{% endif %}{% endblock %}
{% block content %}
<div class="card">
  <div class="row" style="justify-content: space-between; align-items: center;">
    <div>
      <h2>{% if poem_id %}编辑诗词 #{{ poem_id }}{% else %}新增诗词{% endif %}</h2>
      <p class="muted">保存后会写入诗库文件，并自动重建展示数据。你是维护者，可以直接在这里增删改。</p>
    </div>
    <a class="btn-secondary pill-link" href="{{ url_for('poem_admin_page') }}">返回诗库维护</a>
  </div>
</div>

<form method="post" class="card poem-form">
  <div class="row">
    <div>
      <label class="field-label">日期</label>
      <input type="date" name="poem_date" value="{{ form.poem_date }}" required />
    </div>
  </div>

  <div style="margin-top: 14px;">
    <label class="field-label">诗句内容</label>
    <textarea name="content" rows="3" style="width: 100%;" required placeholder="例如：竹斋眠听雨，梦里长青苔">{{ form.content }}</textarea>
  </div>

  <h3>诗境信息（可选）</h3>
  <div class="row">
    <div style="flex: 1; min-width: 240px;">
      <label class="field-label">出处</label>
      <input type="text" name="source" value="{{ form.source }}" placeholder="宋 · 蒋捷《视夜》" style="width: 100%;" />
    </div>
  </div>

  <div style="margin-top: 12px;">
    <label class="field-label">全诗</label>
    <textarea name="full_poem" rows="4" style="width: 100%;" placeholder="可粘贴完整诗词">{{ form.full_poem }}</textarea>
  </div>

  <div style="margin-top: 12px;">
    <label class="field-label">创作背景</label>
    <textarea name="background" rows="3" style="width: 100%;">{{ form.background }}</textarea>
  </div>

  <div style="margin-top: 12px;">
    <label class="field-label">解读</label>
    <textarea name="interpretation" rows="4" style="width: 100%;">{{ form.interpretation }}</textarea>
  </div>

  <div style="margin-top: 12px;">
    <label class="field-label">意在何处</label>
    <textarea name="meaning" rows="3" style="width: 100%;">{{ form.meaning }}</textarea>
  </div>

  <div class="row" style="margin-top: 18px; justify-content: space-between;">
    <button type="submit">保存诗词</button>
    {% if poem_id %}
    <button type="submit"
            formaction="{{ url_for('poem_delete_page', poem_id=poem_id) }}"
            formmethod="post"
            class="btn-secondary"
            onclick="return confirm('确定删除这条诗词吗？');">
      删除这首
    </button>
    {% endif %}
  </div>
</form>
{% endblock %}
