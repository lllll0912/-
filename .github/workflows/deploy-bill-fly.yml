name: Deploy personal site to Fly

on:
  push:
    branches: [main]
    paths:
      - "医疗/**"
      - "喝水/**"
      - "诗词/**"
      - "日志/**"
      - "账单/**"
      - "收藏/**"
      - "脚本/**"
      - "fly.toml"
      - ".github/workflows/deploy-bill-fly.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy to Fly.io
        run: flyctl deploy --remote-only --app bill-private-lllll0912
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
