name: Deploy personal site to Fly

on:
  push:
    branches: [main]
    paths:
      - "医疗/**"
      - "喝水/**"
      - "诗词/**"
      - "日志/**"
      - "账单/**"
      - "收藏/**"
      - "脚本/**"
      - "fly.toml"
      - ".github/workflows/deploy-bill-fly.yml"
    paths-ignore:
      # 运行态数据变更不发版（评分/图片写入 GitHub 时勿触发 fly deploy）
      - "收藏/数据/**"
      - "医疗/数据/**"
      - "backups/**"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy to Fly.io
        # 1) Depot 远程构建机常超时 → 不用 Depot
        # 2) Fly remote builder 无法处理中文路径（followpaths / dockerignore）
        #    → 在 Actions 自带 Docker 上本地构建再推送
        run: flyctl deploy --local-only --app bill-private-lllll0912
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
